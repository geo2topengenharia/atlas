<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* ===== Identidade Geo2Top — o tema segue o sistema operacional (claro/escuro) ===== */
:root{
  --g2-green:#13a84e; --g2-blue:#0a8dbb; --g2-orange:#e8862e; --g2-sky:#49bdf0;
  /* tema claro (padrão) */
  --bg-app:#f3f6f4; --bg-panel:#ffffff; --text-primary:#17211b; --text-secondary:#56665d; --border-color:#d9e2dc;
  --brand:#0f8a40; --brand-ink:#ffffff; --accent:var(--g2-orange); --old:var(--g2-blue); --new:var(--g2-orange);
  --map-bg:#cfd8d3; --warn:#c2410c; --shadow:0 2px 10px rgba(10,40,20,.14); color-scheme:light;
}
/* tema escuro: automático pelo sistema (se o usuário não forçou "claro") ou forçado pelo botão */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg-app:#0d1210; --bg-panel:#161e1a; --text-primary:#eef3f0; --text-secondary:#9db0a5; --border-color:#28352e;
         --brand:#2cc46a; --brand-ink:#04140a; --old:#3fb2e6; --map-bg:#1d2622; --warn:#fb923c; --shadow:0 2px 12px rgba(0,0,0,.55); color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg-app:#0d1210; --bg-panel:#161e1a; --text-primary:#eef3f0; --text-secondary:#9db0a5; --border-color:#28352e;
         --brand:#2cc46a; --brand-ink:#04140a; --old:#3fb2e6; --map-bg:#1d2622; --warn:#fb923c; --shadow:0 2px 12px rgba(0,0,0,.55); color-scheme:dark; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg-app);color:var(--text-primary);display:flex;flex-direction:column}
header{background:var(--bg-panel);border-bottom:1px solid var(--border-color);border-top:4px solid var(--g2-green);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between;position:relative}
header::before{content:"";position:absolute;top:-4px;left:0;height:4px;width:34%;background:linear-gradient(90deg,var(--g2-green) 0 60%,var(--g2-blue) 60% 85%,var(--g2-orange) 85%)}
.brand{display:flex;align-items:center;gap:16px;min-width:0}

.logo .logo-sub{background:var(--text-primary);-webkit-mask:var(--logo-sub) center/contain no-repeat;mask:var(--logo-sub) center/contain no-repeat}
.vr{width:1px;align-self:stretch;background:var(--border-color)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)}
.eyebrow b{color:var(--brand);font-weight:700}
h1{margin:0;font-size:22px;line-height:1.15}
.sub{color:var(--text-secondary);font-size:13px}
.downloads{display:flex;flex-wrap:wrap;gap:8px}
.dl{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--border-color);border-radius:10px;background:var(--bg-app);color:var(--text-primary);text-decoration:none;font-weight:600;font-size:14px;transition:.15s}
.dl:hover{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.dl svg{width:18px;height:18px;flex:none}
.dl small{font-weight:400;opacity:.7}
.dl[aria-disabled="true"]{opacity:.5;pointer-events:none}
button.dl{font-family:inherit;cursor:pointer}
.dl .caret{width:14px;height:14px;margin-left:-2px;transition:transform .15s}
.dl[aria-expanded="true"] .caret{transform:rotate(180deg)}
.dl-wrap{position:relative}
.dl-menu{position:absolute;top:calc(100% + 6px);min-width:270px;z-index:6000;background:var(--bg-panel);border:1px solid var(--border-color);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px}
.dl-menu[hidden]{display:none}
.dl-item{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:10px 12px;border:0;border-radius:8px;background:none;color:var(--text-primary);font:inherit;cursor:pointer;text-align:left}
.dl-item:hover{background:var(--bg-app)}
.dl-item:disabled{opacity:.5;cursor:not-allowed}
.dl-item small{color:var(--text-secondary);font-weight:400}
#toolsToggle{display:none}
main{flex:1;position:relative;min-height:0}
#map{position:absolute;inset:0;background:var(--map-bg)}
.leaflet-container{font:inherit}
.leaflet-image-layer{pointer-events:none}
.panel{position:absolute;z-index:1100;background:var(--bg-panel);color:var(--text-primary);border:1px solid var(--border-color);border-radius:12px;box-shadow:var(--shadow)}
#layers{top:12px;right:12px;padding:12px 14px;width:270px;max-width:calc(100% - 24px)}
#layers h2{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}
.row[hidden],.opac[hidden],.sep[hidden],.hint[hidden]{display:none}
.row label{flex:1;cursor:pointer}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
.row input[type=checkbox]{width:17px;height:17px;accent-color:var(--brand)}
.sep{border:0;border-top:1px solid var(--border-color);margin:10px 0}
.opac{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-secondary)}
.opac input{flex:1;accent-color:var(--brand)}
select{width:100%;padding:6px;border-radius:8px;border:1px solid var(--border-color);background:var(--bg-app);color:var(--text-primary);font:inherit}
.hint{font-size:12px;color:var(--text-secondary);margin:6px 0 0}
#tools{top:12px;left:56px;display:flex;flex-wrap:wrap;gap:6px;padding:6px;max-width:calc(100% - 56px - 300px)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--border-color);border-radius:8px;background:var(--bg-app);color:var(--text-primary);font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn svg{width:17px;height:17px}

    linkedin: "",       // PREENCHER: URL completa — vazio = não aparece

      { label: "A01", note: "", url: "#" }

  ]
};

// limites [[sul, oeste],[norte, leste]] em graus decimais
function safeBounds(b){
  if (!Array.isArray(b) || b.length !== 2 || !b.every(Array.isArray)) return null;
  const [s, w, n, e] = [b[0][0], b[0][1], b[1][0], b[1][1]].map(Number);
  if (![s, w, n, e].every(Number.isFinite) || s === n || w === e) return null;
  if ([s, n].some(v => Math.abs(v) > 85) || [w, e].some(v => Math.abs(v) > 180)) return null;
  return [[Math.min(s, n), Math.min(w, e)], [Math.max(s, n), Math.max(w, e)]];
}
// link: só http(s) ou caminho relativo simples (sem "..", sem "javascript:", sem "data:")
function safeUrl(u){
  u = str(u, 2000); if (!u || u === '#') return '#';
  if (/^https?:\/\//i.test(u)){ try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : '#'; } catch (_) { return '#'; } }
  if (/^[\w][\w./-]*$/.test(u) && !u.includes('..')) return u;
  return '#';
}
// identifica arquivos e pastas do Google Drive em qualquer formato de link
function driveId(u){
  const m = String(u).match(/drive\.google\.com\/(?:file\/d\/|open\?(?:[^#]*&)?id=|uc\?(?:[^#]*&)?id=|thumbnail\?(?:[^#]*&)?id=)([\w-]{10,})/);
  return m ? m[1] : null;
}
function driveFolder(u){ const m = String(u).match(/drive\.google\.com\/drive\/(?:u\/\d+\/)?folders\/([\w-]{10,})/); return m ? m[1] : null; }
// downloads: links do Drive viram a página "view" (funciona com arquivo grande, com o aviso de antivírus do Drive)
function safeLink(u){
  const s = safeUrl(u); if (s === '#') return '#';
  const id = driveId(s); if (id) return `https://drive.google.com/file/d/${id}/view?usp=sharing`;
  const f = driveFolder(s); if (f) return `https://drive.google.com/drive/folders/${f}?usp=sharing`;
  return s;
}
// imagem da ortofoto: link do Drive vira o endereço de miniatura em tamanho grande (EXPERIMENTAL: o Drive pode limitar)
function safeImg(u){
  const s = safeUrl(u); if (s === '#') return '';

}

    if ([o.new.pmtiles, o.old.pmtiles].some(x => x && safePm(x).startsWith('drive:')) && !CONFIG.chaves.googleDrive) w.push('Ortofoto no Drive precisa da chave do Google em CONFIG.chaves.googleDrive (no arquivo da página).');
    if ([o.new.pmtiles, o.old.pmtiles].some(x => x && !safePm(x))) w.push('Link de PMTiles inválido.');
    if (o.new.tiles && !safeTiles(o.new.tiles) || o.old.tiles && !safeTiles(o.old.tiles)) w.push('Endereço de tiles inválido: precisa conter {z}, {x} e {y}.');
    if ([o.new.image, o.old.image].some(i => i && driveId(i))) w.push('Imagem no Google Drive é experimental — teste o link antes de enviar.');
    if ([o.new.image, o.old.image, o.new.tiles, o.old.tiles].some(i => i && !/^https?:/i.test(i))) w.push('Imagem/tiles com caminho relativo: os arquivos precisam estar na mesma pasta desta página no servidor.');
    const semLink = o.downloads.flatMap(d => d.menu ? d.menu.filter(m => m.url === '#').map(m => d.name + ' ' + m.label) : (d.url === '#' ? [d.name] : []));
    if (semLink.length) w.push('Sem link (botão ficará desativado): ' + semLink.join(', ') + '.');
    if (location.protocol === 'file:') w.push('Esta página está aberta do seu computador (file://). O link só funciona para o cliente depois que a página estiver hospedada — gere o link a partir do endereço do site.');
    if (link && link.length > 2000) w.push(`Link longo (${link.length} caracteres): alguns aplicativos podem cortá-lo. Prefira o link curto com JSON (#p=).`);
    const box = ed.querySelector('#edWarn'); box.hidden = !w.length; box.innerHTML = w.length ? '<b>Verifique:</b><ul>' + w.map(t => `<li>${esc(t)}</li>`).join('') + '</ul>' : '';
  }
  const base = () => location.href.split('#')[0];
  const hashOf = async o => 'cfg=' + await pack(JSON.stringify(o));
  async function copyText(t){
    try { await navigator.clipboard.writeText(t); return true; }
    catch (_) { const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (__) {} ta.remove(); return ok; }
  }
  const reopen = () => { try { sessionStorage.setItem('atlas-editor', '1'); sessionStorage.setItem('atlas-editor-open', '1'); } catch (_) {} };

  ed.querySelector('#edGen').onclick = async () => {
    const o = collect(), jid = jsonId(), link = base() + '#' + (jid ? 'd=' + jid : await hashOf(o));
    ed.querySelector('#edLink').value = link; check(o, link);
    if (jid && !CONFIG.chaves.googleDrive) toast('O link curto (#d=) precisa da chave do Google em CONFIG.chaves.googleDrive.', 7000);
    toast(await copyText(link) ? 'Link do cliente copiado.' : 'Copie o link no campo "Link gerado".');
  };
  ed.querySelector('#edLink').addEventListener('focus', e => e.target.select());
  ed.querySelector('#edPrev').onclick = async () => { const o = collect(); reopen(); location.hash = await hashOf(o); location.reload(); };
  ed.querySelector('#edExp').onclick = () => {
    const o = collect(), nome = (o.projeto.codigo || o.projeto.titulo || 'atlas').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9-]+/g, '-').replace(/^-|-$/g, '') || 'atlas';
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(o, null, 2)], { type:'application/json' })); a.download = nome + '.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast(`JSON exportado. No servidor, salve em projetos/${nome}.json e envie: ${base()}#p=${nome}`, 9000);
  };
  ed.querySelector('#edImp').onchange = e => {
    const f = e.target.files[0]; if (!f) return; const rd = new FileReader();
    rd.onload = async () => { try { const o = JSON.parse(rd.result); reopen(); location.hash = await hashOf(o); location.reload(); } catch (err) { toast('JSON inválido: ' + err.message, 5000); } };
    rd.readAsText(f); e.target.value = '';
  };
  ed.querySelector('#edView').onclick = () => { const b = map.getBounds(); F('bounds').value = bTxt([[+b.getSouth().toFixed(7), +b.getWest().toFixed(7)], [+b.getNorth().toFixed(7), +b.getEast().toFixed(7)]]); };
  ed.querySelector('#edDlAdd').onclick = () => { addRow(); edDl.lastElementChild.querySelector('.n').focus(); };
  const openEd = () => { fill(); ed.hidden = false; $('#editBtn').hidden = false; try { sessionStorage.setItem('atlas-editor', '1'); } catch (_) {} ed.querySelector('[data-f="projeto.titulo"]').focus(); };
  const closeEd = () => { ed.hidden = true; };
  ed.querySelector('#edClose').onclick = closeEd;
  $('#editBtn').onclick = () => ed.hidden ? openEd() : closeEd();
  addEventListener('keydown', e => {
    if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 'e'){ e.preventDefault(); ed.hidden ? openEd() : closeEd(); }
    else if (e.key === 'Escape' && !ed.hidden && $('#nameDlg').hidden) closeEd();
  });
  // engrenagem: visível no modelo (sem configuração no link) e para quem já abriu o editor nesta aba
  let flag = false; try { flag = sessionStorage.getItem('atlas-editor') === '1'; } catch (_) {}
  $('#editBtn').hidden = SHARED && !flag;
  let again = false; try { again = sessionStorage.getItem('atlas-editor-open') === '1'; sessionStorage.removeItem('atlas-editor-open'); } catch (_) {}
  if (again) setTimeout(openEd, 300);
})();
if (CFG_ERR) toast('Não foi possível carregar a configuração do link: ' + CFG_ERR, 7000);

/* ================= TUTORIAL DE BOAS-VINDAS ================= */
(() => {
  const KEY = 'atlas-tour-' + SLUG;
  const ic = {
    wheel:'<svg class="wheel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="6" y="2.5" width="12" height="19" rx="6"/><path d="M12 6.5v4"/></svg>',
    pinch:'<svg class="pinch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10m0-1.5a1.5 1.5 0 0 1 3 0V11m0-.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.5a5 5 0 0 1-4-2L4 14.5a1.5 1.5 0 0 1 2.3-1.8L9 15"/></svg>',
    drag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M12 3l-3 3m3-3 3 3M12 21l-3-3m3 3 3-3M3 12l3-3m-3 3 3 3M21 12l-3-3m3 3-3 3"/></svg>'
  };
  const touch = () => matchMedia('(pointer:coarse)').matches;
  const dlKeys = CONFIG.downloads.map(d => d.key);
  const DLTXT = { DWG:'desenho para CAD.', ECW:'a ortofoto em alta resolução.', KMZ:'para abrir no Google Earth.', PDF:'planta para impressão.', TIF:'a ortofoto em GeoTIFF.' };
  const STEPS = [
    { full:true, title:'Bem-vindo(a) ao Atlas',
      body: () => `<p>Aqui você visualiza a <b>imagem aérea retificada mais recente</b> da sua área${HAS_OLD && HAS_NEW ? ', pode compará-la com o levantamento anterior' : ''}, fazer medições e baixar os arquivos da entrega.</p>
        <div class="tgest"><div>${touch() ? ic.pinch : ic.wheel}${touch() ? 'Pinça com dois dedos<br>para aproximar' : 'Roda do mouse<br>para aproximar'}</div><div>${ic.drag}${touch() ? 'Arraste com um dedo<br>para mover' : 'Clique e arraste<br>para mover'}</div></div>
        <div class="tnote">O tutorial leva menos de um minuto.</div>`, next:'Começar o tour' },
    { target:'#layers', prefer:['left','below'], title:'Escolha o que ver', badge:'Camadas',
      body: () => `<p>Neste painel você:</p><ul>
        <li>• <span><b>Liga e desliga</b> as imagens disponíveis.</span></li>
        <li>• <span><b>Controla a transparência</b> da imagem sobre as demais.</span></li>
        ${HAS_OLD && HAS_NEW ? '<li>• <span><b>Compara</b> as duas com um divisor que você arrasta sobre o mapa.</span></li>' : ''}
        <li>• <span>Troca o <b>mapa de fundo</b> (satélite ou ruas).</span></li></ul>` },
    { target:'#tools', prefer:['below'], title:'Meça e registre', badge:'Ferramentas',
      body: () => `<ul>
        <li>• <span><b>Marcar ponto, Medir percurso e Medir área:</b> ${touch() ? 'toque' : 'clique'} no mapa para colocar os pontos; o resultado aparece na hora, com coordenadas em ${esc(CRS)}.</span></li>
        <li>• <span><b>Capturar tela:</b> escolha uma área e copie, salve ou envie a imagem pelo WhatsApp.</span></li>
        <li>• <span><b>Enquadrar:</b> volta para a vista geral da área.</span></li></ul>`, expandTools:true },
    { target:'#downloads', prefer:['below'], title:'Baixe os arquivos', badge:'Downloads',
      body: () => `<ul>${CONFIG.downloads.map(d => `<li>• <span><b>${esc(d.name)}:</b> ${DLTXT[d.key] || esc(d.note || 'arquivo da entrega') + '.'}${d.menu && d.menu.length > 1 ? ` A área está dividida em ${d.menu.length} arquivos.` : ''}</span></li>`).join('')}</ul>
        <p style="margin-top:10px">Você pode baixar ou enviar o link pelo WhatsApp. Para rever este tutorial, use o botão <b>Tutorial</b> nas ferramentas.</p>`, next:'Concluir' }
  ].filter(s => s.target !== '#downloads' || dlKeys.length);
  const root = document.createElement('div'); root.id = 'tour';
  root.innerHTML = '<div class="tshield"></div><div class="tspot"></div><svg class="tarrow" aria-hidden="true"><path class="line"/><path class="head"/></svg><div class="tcard" role="dialog" aria-modal="true" aria-labelledby="tTitle"></div>';
  document.body.appendChild(root);
  const spot = root.querySelector('.tspot'), card = root.querySelector('.tcard'), line = root.querySelector('path.line'), head = root.querySelector('path.head');
  let i = 0, restore = [];
  const lay = $('#layers'), tools = $('#tools');
  function prepare(s){
    if (s.target === '#layers' && lay.classList.contains('collapsed')){ lay.classList.remove('collapsed'); restore.push(() => lay.classList.add('collapsed')); }
    if (s.expandTools && tools.classList.contains('collapsed')){ tools.classList.remove('collapsed'); $('#toolsToggle').setAttribute('aria-expanded','true'); restore.push(() => { tools.classList.add('collapsed'); $('#toolsToggle').setAttribute('aria-expanded','false'); }); }
  }
  function rectOf(el){ const r = el.getBoundingClientRect(), p = 8; return { l:r.left-p, t:r.top-p, r:r.right+p, b:r.bottom+p, w:r.width+2*p, h:r.height+2*p }; }
  const clampN = (v, a, b) => Math.min(Math.max(v, a), b);
  function draw(){
    const s = STEPS[i]; root.classList.toggle('full', !!s.full);
    card.innerHTML = `${s.full ? '<div class="logo tlogo"><img src="' + LOGO_COR + '" alt=""><span class="logo-sub" aria-hidden="true"></span></div>' : ''}${s.badge ? `<div class="tstep">${i} de ${STEPS.length-1} · ${s.badge}</div>` : ''}<h3 id="tTitle">${s.title}</h3><div class="tbody">${s.body()}</div>
      <div class="tfoot"><div class="tdots">${STEPS.map((_,k) => `<i class="${k===i?'on':''}"></i>`).join('')}</div>
      <div class="tbtns">${i < STEPS.length-1 ? '<button class="tskip" data-a="skip">Pular</button>' : ''}${i>0 ? '<button class="btn" data-a="prev">Voltar</button>' : ''}<button class="btn primary" data-a="next">${i === STEPS.length-1 ? 'Concluir' : (s.next || 'Próximo')}</button></div></div>`;
    card.style.animation = 'none'; void card.offsetWidth; card.style.animation = '';
    line.removeAttribute('d'); head.removeAttribute('d'); line.style.animation = head.style.animation = 'none';
    if (s.full){ card.style.left = card.style.top = ''; return; }
    prepare(s);
    requestAnimationFrame(() => place(s));
  }
  function place(s){
    const el = document.querySelector(s.target); if (!el) return;
    const R = rectOf(el), W = innerWidth, H = innerHeight, small = W <= 640;
    spot.style.left = R.l+'px'; spot.style.top = R.t+'px'; spot.style.width = R.w+'px'; spot.style.height = R.h+'px';
    const cw = card.offsetWidth, ch = card.offsetHeight, GAP = small ? 64 : 96; let x, y;
    if (small){ x = 12; const below = H - R.b > R.t; y = below ? Math.min(R.b + GAP, H - ch - 12) : Math.max(R.t - GAP - ch, 12); y = clampN(y, 12, H - ch - 12); }
    else {
      const opts = {
        left:  () => ({ x:R.l - GAP - cw, y:R.t + 110 }),
        below: () => ({ x:clampN(R.r - cw, 16, W - cw - 16) < R.l - 200 ? R.l + 24 : clampN(R.r - cw, 16, W - cw - 16), y:R.b + GAP }),
        above: () => ({ x:clampN(R.l, 16, W - cw - 16), y:R.t - GAP - ch })
      };
      let pick = null;
      for (const k of s.prefer.concat(['below','above','left'])){ const c = opts[k](); if (c.x >= 12 && c.y >= 12 && c.x + cw <= W - 12 && c.y + ch <= H - 12){ pick = c; break; } }
      pick = pick || { x:clampN(R.l, 12, W - cw - 12), y:clampN(R.b + GAP, 12, H - ch - 12) };
      x = pick.x; y = pick.y;
      if (s.target === '#tools') x = clampN(R.l + 30, 12, W - cw - 12);
    }
    card.style.left = x+'px'; card.style.top = y+'px';
    arrow({ l:x, t:y, r:x+cw, b:y+ch }, R);
  }
  function arrow(C, T){
    const tx = (T.l+T.r)/2, ty = (T.t+T.b)/2;
    let sx, sy, ex, ey;
    const horiz = C.r < T.l || C.l > T.r;
    if (horiz){ sx = C.r < T.l ? C.r : C.l; sy = clampN(ty, C.t+24, C.b-24); ex = C.r < T.l ? T.l : T.r; ey = clampN(sy, T.t+14, T.b-14); }
    else { sy = C.t > T.b ? C.t : C.b; sx = clampN(tx, C.l+30, C.r-30); ey = C.t > T.b ? T.b : T.t; ex = clampN(sx, T.l+30, T.r-30); }
    const dx = ex - sx, dy = ey - sy, d = Math.hypot(dx, dy) || 1, bend = Math.min(70, d*.35) * (horiz ? (dy >= 0 ? -1 : 1) : (dx >= 0 ? 1 : -1)) * (horiz ? 1 : -1);
    const qx = (sx+ex)/2 + (-dy/d)*bend, qy = (sy+ey)/2 + (dx/d)*bend;
    const ang = Math.atan2(ey - qy, ex - qx), a = 13, sp = .42;
    const p1 = [ex - a*Math.cos(ang - sp), ey - a*Math.sin(ang - sp)], p2 = [ex - a*Math.cos(ang + sp), ey - a*Math.sin(ang + sp)];
    const ex2 = ex - 4*Math.cos(ang), ey2 = ey - 4*Math.sin(ang);
    line.setAttribute('d', `M${sx},${sy} Q${qx},${qy} ${ex2},${ey2}`);
    head.setAttribute('d', `M${ex},${ey} L${p1[0]},${p1[1]} L${p2[0]},${p2[1]} Z`);
    const len = Math.ceil(line.getTotalLength()) + 4; line.style.setProperty('--len', len);
    void line.getBoundingClientRect(); line.style.animation = head.style.animation = '';
  }
  function open(){ if (root.classList.contains('on')) return; if (document.body.classList.contains('capturing')) return; i = 0; root.classList.add('on'); draw(); card.querySelector('[data-a="next"]').focus(); }
  function close(done){
    root.classList.remove('on'); restore.splice(0).forEach(f => f());
    if (done){ try { localStorage.setItem(KEY, '1'); } catch (_) {} }
  }
  card.addEventListener('click', e => { const a = e.target.dataset && e.target.dataset.a; if (!a) return;
    if (a === 'skip') close(true);
    else if (a === 'prev'){ restore.splice(0).forEach(f => f()); i = Math.max(0, i-1); draw(); }
    else if (i === STEPS.length-1) close(true); else { i++; draw(); } });
  addEventListener('keydown', e => { if (!root.classList.contains('on')) return;
    if (e.key === 'Escape'){ e.stopPropagation(); close(true); }
    else if (e.key === 'ArrowRight' || e.key === 'Enter'){ if (document.activeElement && document.activeElement.dataset.a) return; e.preventDefault(); card.querySelector('[data-a="next"]').click(); }
    else if (e.key === 'ArrowLeft'){ const b = card.querySelector('[data-a="prev"]'); if (b) b.click(); } }, true);
  addEventListener('resize', () => { if (root.classList.contains('on')) draw(); });
  const b = document.createElement('button'); b.className = 'btn'; b.id = 'btnTour'; b.title = 'Rever o tutorial';
  b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5M12 17h.01"/></svg><span>Tutorial</span>';
  b.onclick = open; tools.appendChild(b);
  const q = new URLSearchParams(location.search); let seen = false; try { seen = !!localStorage.getItem(KEY); } catch (_) {}
  // não abre o tutorial por cima do editor (pré-visualização)
  if (q.get('tour') === '1' || (!seen && !q.has('c') && !q.has('swipe'))) setTimeout(() => { if ($('#editor').hidden) open(); }, 900);
})();
}   // fim de start()
